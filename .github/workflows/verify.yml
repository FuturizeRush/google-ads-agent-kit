name: Verify public kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline behavior tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Public file and history policy
        run: python3 scripts/check_public_tree.py --history
      - name: Download pinned Gitleaks release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$RUNNER_TEMP/gitleaks-bin"
          python3 -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"gitleaks-bin/gitleaks_8.30.1_linux_x64.tar.gz"; expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"; actual=hashlib.sha256(p.read_bytes()).hexdigest(); raise SystemExit(0 if actual == expected else "Checksum mismatch")'
          tar -xzf "$RUNNER_TEMP/gitleaks-bin/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Gitleaks working tree and history
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir . --redact --no-banner
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --redact --no-banner --log-opts="--all"
